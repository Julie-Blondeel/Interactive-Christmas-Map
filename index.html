<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive_map</title>
    <link rel = "stylesheet"href="style.css" /> 
</head>

<body>
    <main class="page">

        <div class="map-viewer" id="mapViewer">
        <div class="map-layer" id="mapLayer">
            <img 
            src="./images/Clipping mask map.png" 
            alt="Interactive map" 
            class="map-image" 
            id="mapImage"
            />

    <!--Parking-->

            <img src="./images/Autos.svg"
            class="map-object parking-object"
            alt="Parking" />

    <!--Shop-->

            <img src="./images/Shop.svg"
            class="map-object shop-object"
            alt="Shop" />

    <!--OCMW-->

            <img src="./images/ocmw.svg"
            class="map-object ocmw-object"
            alt="OCMW" />

    <!--Dierentuin-->
            <img src="./images/dierentuin.svg"
            class="map-object dierentuin-object"
            alt="dierentuintje" />

    <!--Buildings-->
            <img src="./images/Buildings.svg"
             class="map-object buildings-object"
             alt="buildings" />

    <!--Caffe-->
            <img src="./images/Caffe.svg"
             class="map-object caffe-object"
             alt="caffe" />     
             
    <!--Bus stop-->
            <img src="./images/Busstop.svg"
             class="map-object busstop-object"
             alt="bus stop" />  

    <!--Clothes shop-->
            <img src="./images/clothesshop.svg"
            class="map-object clothesshop-object"
            alt="clothes shop" />

    <!--Stadhuis-->

    <button
        class="marker stadhuis-marker"
        style="left:62%; top:24%;"
        data-title="Stadhuis/MOU"
        data-text="Visit Oudenaarde"
        >
    <img src="./images/Stadhuis.svg" alt="Stadhuis" />
    </button>

    <!--Fontain 1-->

    <button
        class="marker fontain-marker"
        style="left:63%; top:27%;"
        data-title="Fontein"
        data-text="Fontain"
        >
    <img src="./images/Fontain.svg" alt="Fontain" />
    </button>
    
    <!--St Walburga -->
       
    <button
        class="marker walburga-marker"
        style="left:46%; top:80%;"
        data-title="Sint-Walburgakerk"
        data-text="Werkuuren"
        >
        <img src="./images/St Walburga.svg" alt="St. Walburga kerk" />
    </button>

    <!--Carilon-->

    <button
        class="marker carilon-marker"
        style="left:54%; top:85%;"
        data-title="Carillon"
        data-text="Carilon"
        >
        <img src="./images/Carilon.svg" alt="Caffe Carilon" />
    </button>

<!--Glijbaan-->

    <button
        class="marker glijbaan-marker"
        style="left:82%; top:60%;"
        data-title="Winterglijbaan"
        data-text="werkuuren"
        >
        <img src="./images/Glijbaan.svg" alt="Glijbaan" />
    </button>

<!--Train-->

    <button
        class="marker train-marker"
        style="left:67%; top:38%;"
        data-title="Kersttrein"
        data-text="werkuuren"
        >
        <img src="./images/Train.svg" alt="Kerst train" />
    </button>

<!--Bisschopkwartier-->

     <button
        class="marker santa-marker"
        style="left:53%; top:57%;"
        data-title="Huis van de Kerstman"
        data-text="Bisschopkwartier"
        >
        <img src="./images/Santa.svg" alt="Bisschopkwartier" />
    </button>

    <!--Book-->

     <button
        class="marker book-marker"
        style="left:40%; top:63%;"
        data-title="Vertelseles door Stam"
        data-text="Werkuuren"
        >
        <img src="./images/Book.svg" alt="Boek" />
    </button>

     <!--Left side-->

      <button
        class="marker left-marker"
        style="left:61%; top:45%;"
        data-title="Kerstmarkt"
        data-text="Kiosks"
        >
        <img src="./images/Left.svg" alt="Kiosks" />
    </button>

   <!--Right side-->

      <button
        class="marker right-marker"
        style="left:74%; top:38%;"
        data-title="Kerstmarkt"
        data-text="Kiosks"
        >
        <img src="./images/Right.svg" alt="Kiosks" />
    </button>

     <!--Back side-->

      <button
        class="marker back-marker"
        style="left:72%; top:74%;"
        data-title="Kerstmarkt"
        data-text="Kiosks"
        >
        <img src="./images/Back.svg" alt="Kiosks" />
    </button>

     <!--Centre-->

      <button
        class="marker centre-marker"
        style="left:73%; top:56%;"
        data-title="Kerstmarkt"
        data-text="Kiosks"
        >
        <img src="./images/Centre.svg" alt="Kiosks" />
    </button>

     <!--Horses-->

      <button
        class="marker horses-marker"
        style="left:72%; top:55%;"
        data-title="Rotonde"
        data-text="Horses"
        >
        <img src="./images/Horses.svg" alt="Carusel" />
    </button>

    <!--Little Horses-->

      <button
        class="marker little-marker"
        style="left:68%; top:62%;"
        data-title="Kleine Rotonde"
        data-text="Horses"
        >
        <img src="./images/Little.svg" alt="Carusel" />
    </button>

    <div class="popup hidden" id="popup">
        <button class="popup-close" id="popupClose" aria-label="Close popup">×</button>
        <h3 id="popupTitle"></h3>
        <p id="popupText"></p>
    </div>
    </div>
    </div>

    </main>

    <script
    src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
