<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive_map</title>
    <link rel = "stylesheet"href="style.css" /> 
</head>

<body>
    <main class="page">

        <div class="map-viewer" id="mapViewer">
        <div class="map-layer" id="mapLayer">
            <img 
            src="./images/Clipping mask map.png" 
            alt="Interactive map" 
            class="map-image" 
            id="mapImage"
            />

    <!--Marker 1-->

    <button
        class="marker"
        style="left:62%; top:23%;"
        data-title="Location 1"
        data-text="Here we can add our description."
        >
    <img src="./images/Stadhuis.svg" alt="Location 1" />
    </button>
    
    <!--Marker 2-->
       
    <button
        class="marker"
        style="left:50%; top:80%;"
        data-title="Location 2"
        data-text="Here we can add our description."
        >
        <img src="./images/St Walburga bigger.svg" alt="Location 2" />
    </button>

    <!--Marker 3-->

    <button
        class="marker"
        style="left:28%; top:67%;"
        data-title="Location 3"
        data-text="Here we can add our description."
        >
        <img src=".images/icon3.png" alt="Location 3" />
    </button>

    <div class="popup hidden" id="popup">
        <button class="popup-close" id="popupClose" aria-label="Close popup">×</button>
        <h3 id="popupTitle"></h3>
        <p id="popupText"></p>
    </div>
    </div>
    </div>

    </main>

    <script
    src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
